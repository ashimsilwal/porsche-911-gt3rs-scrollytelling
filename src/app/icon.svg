<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Dark Luxury Titanium Backdrop -->
  <rect width="64" height="64" fill="url(#bgGrad)" />
  
  <!-- Sharp Geometric Outer Frame -->
  <rect x="1.5" y="1.5" width="61" height="61" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Speed Telemetry Accents -->
  <rect x="44" y="6" width="12" height="2" fill="url(#accentGrad)" />
  <rect x="50" y="10" width="6" height="2" fill="url(#accentGrad)" opacity="0.6" />

  <!-- High-Precision Motorsport "P" Glyph -->
  <path
    d="M 16 14 L 38 14 C 46.5 14 50 18.5 50 25.5 C 50 32.5 45.5 37 37 37 L 26.5 37 L 26.5 50 L 16 50 Z M 26.5 22.5 L 26.5 28.5 L 35.5 28.5 C 38.5 28.5 40 27.2 40 25.5 C 40 23.8 38.5 22.5 35.5 22.5 Z"
    fill="url(#pGrad)"
  />

  <!-- Weissach Racing Green Corner Indicator -->
  <polygon points="12,52 16,52 16,48" fill="#10b981" />
</svg>
